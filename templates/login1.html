<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Maintenance Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            
            background-image: url('final_img.png'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-color: #e0f2f7;
            
        }
        
        .text-dark-green {
            color: #010d0e; 
        }
        
        .bg-button-green {
            background-color: #0a7c85; 
        }
        
        .input-border-color {
            border-color: #D1D5DB; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
   
    <div class="flex flex-col md:flex-row w-full max-w-3xl bg-white bg-opacity-50 rounded-xl shadow-lg overflow-hidden">

        <div class="md:w-1/2 flex items-center justify-center p-0 bg-illustration-panel relative">
            
            <img src="bg.png">
        </div>

        
        <div class="md:w-1/2 p-8 flex flex-col justify-center">
            <h2 class="text-3xl font-semibold text-dark-green mb-8 text-center md:text-left">
                Predictive Maintenance
            </h2>

            <form class="space-y-4">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        required
                        class="w-full px-2 py-2 border input-border-color rounded-lg focus:outline-none focus:ring-1 focus:ring-dark-green text-sm bg-white bg-opacity-50"
                    />
                </div>

                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                        class="w-full px-2 py-2 border input-border-color rounded-lg focus:outline-none focus:ring-2 focus:ring-dark-green text-sm bg-white bg-opacity-50"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-button-green text-white py-2.5 rounded-lg font-medium hover:bg-opacity-90 transition duration-300 ease-in-out shadow-md text-base"
                >
                    Log In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
