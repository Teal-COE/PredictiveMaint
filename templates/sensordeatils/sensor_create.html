{% extends "base.html" %}
{% load static %}
{% block title %}
    Add Sensor
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center">
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title" style="font-size:25px">Add Sensor</h5>
                <form id="orgForm" method="POST">
                    {% csrf_token %}
                    <div class="row align-items-end mt-2">
                        <div class="col-md-3 form-group">
                            <label for="element_id">Element ID</label>
                            <input id="element_id" name="element_id" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="element_name">Element Name</label>
                            <input id="element_name" name="element_name" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="tag">Tag</label>
                            <input id="tag" name="tag" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="server_ip">Server IP</label>
                            <input id="server_ip" name="server_ip" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="machine_code">Machine Code</label>
                            <input id="machine_code" name="machine_code" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="element_type">Element Type</label>
                            <input id="element_type" name="element_type" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>



                        <div class="col-md-3 form-group">
                            <label for="upper_anamoly_limit">Upper Anomaly Limit</label>
                            <input id="upper_anamoly_limit" name="upper_anamoly_limit" type="number" class="form-control" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="lower_anamoly_limit">Lower Anomaly Limit</label>
                            <input id="lower_anamoly_limit" name="lower_anamoly_limit" type="number" class="form-control" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="remarks" class="form-label">Remarks</label>
                            <input id="remarks" name="remarks" type="text" class="form-control"
                                   oninput="this.value = this.value.replace(/^\s+/, '')" required>
                        </div>

                        <div class="col-md-3 form-group">
                            <label for="org_id">Organization ID</label>
                            <input id="org_id" name="org_id" type="number" class="form-control" required>
                        </div>

                        <div class="col-md-3 pb-4">
                            <div class="form-check">
                                <input name="active" type="checkbox" class="form-check-input" id="additionalFeature1">
                                <label class="form-check-label" for="additionalFeature1">Active</label>
                            </div>

                            <div class="form-check">
                                <input name="prediction" type="checkbox" class="form-check-input" id="additionalFeature2">
                                <label class="form-check-label" for="additionalFeature2">Prediction</label>
                            </div>
                        </div>
                    </div>


                    <div class="ml-auto text-end ">
                        <button type="submit" class="btn btn-success">Submit</button>
                        <a href="{% url 'sensor_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascript %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<style>
    .form-group .text-danger {
    min-height: 1.25rem;  /* Reserve space for error */
    display: block;
    font-size: 0.875rem;
}
    .form-group {
    position: relative;
    min-height: 85px; /* Adjust as needed */
}


</style>
<script>
    $(document).ready(function() {

    // Add custom validator to check for non-whitespace input
    $.validator.addMethod("noWhitespace", function(value, element) {
        return $.trim(value).length > 0;
    }, "This field cannot be empty or whitespace only.");

    // Apply validation to the form
    $("#orgForm").validate({
        errorClass: "text-danger",  // Error message color
        errorElement: "span",       // Error message element
        rules: {
            element_id: {
                required: true,
                noWhitespace: true
            },
            element_name: {
                required: true,
                noWhitespace: true
            },
            tag: {
                required: true,
                noWhitespace: true
            },
            server_ip: {
                required: true,
                noWhitespace: true
            },
            machine_code: {
                required: true,
                noWhitespace: true
            },
            element_type: {
                required: true,
                noWhitespace: true
            },
            upper_anamoly_limit: {
                required: true,
                noWhitespace: true
            },
            lower_anamoly_limit: {
                required: true,
                noWhitespace: true
            },
            remarks: {
                required: true,
                noWhitespace: true
            },
            org_id: {
                required: true,
                noWhitespace: true
            }
        },
        messages: {
            element_id: {
                required: "Please enter element id.",
                noWhitespace: "Please enter element id."
            },
            element_name: {
                required: "Please enter element name.",
                noWhitespace: "Please enter element name."
            },
            tag: {
                required: "Please enter tag.",
                noWhitespace: "Please enter tag."
            },
            server_ip: {
                required: "Please enter server ip.",
                noWhitespace: "Please enter server ip."
            },
            machine_code: {
                required: "Please enter machine code.",
                noWhitespace: "Please enter machine code."
            },
            element_type: {
                required: "Please select a element type.",
                noWhitespace: "Please enter element type."
            },
            upper_anamoly_limit: {
                required: "Please enter range.",
                noWhitespace: "Please enter range."
            },
            lower_anamoly_limit: {
                required: "Please enter range.",
                noWhitespace: "Please enter range."
            },
             remarks: {
                required: "Please enter remarks.",
                noWhitespace: "Please enter remarks."
            },
            org_id: {
                required: "Please enter org id.",
                noWhitespace: "Please enter org id."
            }
        },
        highlight: function(element) {
            $(element).addClass('is-invalid').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid').addClass('is-valid');
        },
    });
});

</script>
{% endblock %}
