{% load static %}
<div id="layoutSidenav">
    <!-- Sidebar Navigation -->
    <div id="layoutSidenav_nav">
        <nav class="sb-sidenav accordion" id="sidenavAccordion" style="background-color: #2C3E50; color: #ecf0f1;">
            <div class="sb-sidenav-menu">
                <div class="nav">
                    <!-- Section Header -->
                    <div class="sb-sidenav-menu-heading" style="color: #ecf0f1;">
                        <img src="{% static 'images/teal_logo.png' %}" alt="teal_logo" style="height:54px;">
                    </div>

                    <!-- Training Screen Link (with updated icon) -->
                    <a class="nav-link {% if request.resolver_match.url_name == 'training_screen' %}active{% endif %}"
                     href="{% url 'training_screen' %}" style="color: #ecf0f1;">
                    <div class="sb-nav-link-icon"><i class="fas fa-brain"></i></div>
                    Training Screen
                    </a>

                      <a class="nav-link {% if request.resolver_match.url_name == 'model_analysis' %}active{% endif %}"
                     href="{% url 'model_analysis' %}" style="color: #ecf0f1;">
                      <div class="sb-nav-link-icon"><i class="fas fa-chart-line"></i></div>
                       Model Analysis
                      </a>



                         <!-- Model Analysis Link (with updated icon) -->
                    <a class="nav-link {% if request.resolver_match.url_name == 'predictive_screen' %}active{% endif %}"
                       href="{% url 'predictive_screen' %}" style="color: #ecf0f1;">
                        <div class="sb-nav-link-icon" style="color: #ecf0f1;">
                            <i class="fas fa-project-diagram"></i> <!-- Changed icon to "chart-line" -->
                        </div>
                        Prediction Screen 
                    </a>

                    <a class="nav-link {% if request.resolver_match.url_name == 'sensor_list' %}active{% endif %}"
                       href="{% url 'sensor_list' %}" style="color: #ecf0f1;">
                        <div class="sb-nav-link-icon" style="color: #ecf0f1;">
                            <i class="fas fa-microchip"></i> <!-- Changed icon to "users" -->
                        </div>
                      <span>Show Sensors</span>
                          {% if anomaly_count %}
                                <div class="badge bg-white text-danger ml-2"> {{ sensor_count }}</div>
                            {% endif %}
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'anomaly_view' %}active{% endif %}"
                       href="{% url 'anomaly_view' %}" style="color: #ecf0f1;">
                        <div class="sb-nav-link-icon" style="color: #ecf0f1;">
                            <i class="fas fa-bell"></i> <!-- Changed icon to "users" -->
                        </div>
                        <span>Anomaly View  </span>
                            {% if anomaly_count %}
                                <div class="badge bg-white text-danger ml-2"> {{ anomaly_count }}</div>
                            {% endif %}
                    </a>
                  <!-- SETTINGS COLLAPSE LINK -->
                  <a class="nav-link" href="#" id="settingsToggle" style="color: #ecf0f1;">
                  <div class="sb-nav-link-icon" style="color: #ecf0f1;">
                   <i class="fas fa-cogs"></i>
                  </div>
                    Settings
                    <div class="sb-sidenav-collapse-arrow"><i class="fas fa-angle-down"></i></div>
                    </a>
                 <!-- SETTINGS SUBMENU -->
                   <div class="collapse" id="collapseSettingsOrg">
                    <nav class="sb-sidenav-menu-nested nav">
                      <a class="nav-link" href="{% url 'organization_list' %}" style="color: #ecf0f1;">Organization settings</a>
                      <a class="nav-link" href="{% url 'email_list' %}" style="color: #ecf0f1;">Email settings</a>
                    </nav>
                   </div>





                </div>
            </div>
            <!-- Sidebar Footer -->
            <div class="sb-sidenav-footer" style="background-color: #34495E; color: #ecf0f1;">
                <div class="small">Logged in as:</div>
                Data Analyst
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div id="layoutSidenav_content" style="margin-left: -20px;">
        <main>
            <div class="container-fluid">
                <!-- Your content here -->
            </div>
        </main>
    </div>
</div>
<style>
    .nav-link.active {
    background-color: #1abc9c !important;
    color: white !important;
    font-weight: bold;
    border-radius: 4px;
}

</style>

<script>
    // Function to toggle the Settings submenu
    document.getElementById("settingsToggle").addEventListener("click", function(event) {
        event.preventDefault();  // Prevent default link behavior

        var collapseElement = document.getElementById("collapseSettingsOrg");
        var icon = document.querySelector("#settingsToggle .sb-sidenav-collapse-arrow i");

        collapseElement.classList.toggle("show");

        if (collapseElement.classList.contains("show")) {
            icon.classList.remove("fa-angle-down");
            icon.classList.add("fa-angle-up");
        } else {
            icon.classList.remove("fa-angle-up");
            icon.classList.add("fa-angle-down");
        }
    });

    // On page load, close submenu unless on a settings page
    window.addEventListener('DOMContentLoaded', function () {
        var collapseElement = document.getElementById("collapseSettingsOrg");
        var icon = document.querySelector("#settingsToggle .sb-sidenav-collapse-arrow i");

        // Get current page name from Django context
        var currentMenu = "{{ request.resolver_match.url_name }}";

        // Pages where settings menu should stay open
        var settingsPages = ["organization_list", "email_list"];

        if (settingsPages.includes(currentMenu)) {
            collapseElement.classList.add("show");
            icon.classList.remove("fa-angle-down");
            icon.classList.add("fa-angle-up");
        } else {
            collapseElement.classList.remove("show");
            icon.classList.remove("fa-angle-up");
            icon.classList.add("fa-angle-down");
        }
    });

    // Prevent the collapse from closing when clicking submenu links
    var subMenuLinks = document.querySelectorAll("#collapseSettingsOrg .nav-link");
    subMenuLinks.forEach(function(link) {
        link.addEventListener("click", function() {
            var collapseElement = document.getElementById("collapseSettingsOrg");
            if (!collapseElement.classList.contains("show")) {
                collapseElement.classList.add("show");
                var icon = document.querySelector("#settingsToggle .sb-sidenav-collapse-arrow i");
                icon.classList.remove("fa-angle-down");
                icon.classList.add("fa-angle-up");
            }
        });
    });
</script>
