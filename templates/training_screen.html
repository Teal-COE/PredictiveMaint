{% extends "base.html" %}
{% load static %}

{% block title %}Training Screen {% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="mt-4"></h1>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" style="font-size:30px">Training Screen</h5>


            <form method="post" id="sensorDataForm">
                {% csrf_token %}
                <div class="row align-items-end mt-2">
                    <div class="col-md-3 form-group">
                        <label for="sensorName" class="form-label" style="font-size:1.2rem">Sensor Name</label>
                        <select id="sensorName" name="sensor_name" class="form-control" required>
                            <option value="">Select a Sensor</option>
                            {% for sensor in sensors %}
                            <option value="{{ sensor.element_id }}"
                                    data-upper="{{ sensor.upper_anamoly_limit|floatformat:3 }}"
                                    data-lower="{{ sensor.lower_anamoly_limit|floatformat:3 }}">
                                {{ sensor.element_name }}
                            </option>
                            {% endfor %}
                        </select>

                    </div>
                    <div class="col-md-3  form-group">
                            <label for="upper_limit" style="font-size:1.2rem">Limit Range</label>
                            <input name="upper_limit" id="range_limit" type="text" class="form-control" readonly >
                    </div>

                    <div class="col-md-3 form-group">
                        <label for="startDatetime" class="form-label" style="font-size:1.2rem">Start Datetime</label>
                        <input type="datetime-local" class="form-control" id="startDatetime" name="start_datetime" required>

                    </div>

                    <div class="col-md-3 form-group">
                        <label for="endDatetime" class="form-label" style="font-size:1.2rem">End Datetime</label>
                        <input type="datetime-local" class="form-control" id="endDatetime" name="end_datetime" required>

                    </div>
                    <div class="text-end ml-auto" style="margin-top:-20px">
                        <button type="submit" class="btn btn-primary w-80" id="getDataButton">Get Data</button>
                        <button  style="display: none;" type="button" class="btn btn-info" id="showPopupButton" >Training Screen</button>
                    </div>
                </div>
            </form>

        <!-- Modal HTML Structure -->
        <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="myModalLabel">Start Training</h5>
            </div>

            <div class="modal-body">
                <!-- Input fields for No of Epochs and No_of_steps -->
                <div class="mb-3">
                <label for="No_of_Epochs" class="form-label">No of Epochs</label>
                <input type="text" class="form-control" id="No_of_Epochs" placeholder="150 - 450" min="150" max="450" value = 250>
                <label class="error" for="No_of_Epochs"></label>
                </div>
                <div class="mb-3">
                <label for="No_of_steps" class="form-label">No of steps</label>
                <input type="text" class="form-control" id="No_of_steps" placeholder="10 - 30" min="10" max="30" value = 12>
                <label class="error" for="No_of_steps"></label>
                </div>
                <div class="mb-3">
                <label for="anomaly_percentage" class="form-label">Anomaly percentage</label>
                <input type="text" class="form-control" id="anomaly_percentage" placeholder="Anamoly limits 1 - 10" min="1" max="10" value = 3>
                <label class="error" for="anomaly_percentage"></label>
            </div>

                <!-- Loading Spinner (Initially hidden) -->
                <div id="loadingSpinner" class="text-center" style="display: none;">
                    <div class="bounce">
                    <div class="bounce-ball"></div>
                    <div class="bounce-ball"></div>
                    <div class="bounce-ball"></div>
                    </div>
                    <p>Processing... Please wait.</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"  id="modal" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="submitNumbers">Start Training</button>
            </div>
            </div>
        </div>
        </div>

        <div class="chart-container" id="chartContainer" style="display: none;box-sizing: border-box;height: 475px;width:100%;">
            <canvas id="chart"></canvas>
        </div>

        </div>
    </div>
</div>

{% endblock %}



{% block javascript %}

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<script src="{% static 'js/jquery.validate.min.js' %}"></script>

<style>

    .form-group .text-danger {
    min-height: 1.00rem;  /* Reserve space for error */
    display: block;
    font-size: 0.875rem;
}
    .form-group {
    position: relative;
    min-height: 100px; /* Adjust as needed */
}



    /* Bouncing balls spinner CSS */
    #loadingSpinner .bounce {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top:80px;

    }

    #loadingSpinner .bounce-ball {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: #3498db;
        margin: 0 5px;
        animation: bounce 1.2s infinite ease-in-out;
    }

    #loadingSpinner .bounce-ball:nth-child(1) {
        animation-delay: 0s;
    }

    #loadingSpinner .bounce-ball:nth-child(2) {
        animation-delay: 0.1s;
    }

    #loadingSpinner .bounce-ball:nth-child(3) {
        animation-delay: 0.2s;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-15px);
        }
    }
</style>

<script>
    $(document).ready(function () {
    $('#sensorName').on('change', function () {
        const selected = $(this).find(':selected');
        const upper = selected.data('upper');
        const lower = selected.data('lower');

        if (selected.val()) {
            console.log('Sensor selected:', selected.text());
            console.log('Upper:', upper, 'Lower:', lower);
            $('#range_limit').val(`${upper} - ${lower}`);
        } else {
            console.log('No sensor selected');
            $('#range_limit').val('');
        }
    });
});

    $(document).ready(function () {
    // Custom validation method to ensure end_datetime is greater than start_datetime
    $.validator.addMethod("greaterThanStart", function (value, element) {
        var startDatetime = $('#startDatetime').val(); // Get the start datetime
        return new Date(value) > new Date(startDatetime); // Compare end datetime with start datetime
    }, "End datetime must be greater than start datetime.");


    $.validator.addMethod("notGreaterThanNow", function(value, element) {
    var selectedDate = new Date(value);
    var now = new Date();

    return selectedDate <= now;
}, "End datetime must not be in the future.");

    // Initialize form validation
    $("#sensorDataForm").validate({

        errorClass: "error text-danger",  // Apply 'text-danger' class to error messages
        errorElement: "label",  // Error messages will be placed in <label> tags
        rules: {
            sensor_name: {
                required: true,  // Ensure a sensor is selected
            },
            start_datetime: {
                required: true,  // Ensure start datetime is provided
            },
            end_datetime: {
                required: true,  // Ensure end datetime is provided
                greaterThanStart: true,  // Custom validation to ensure proper datetime order
                notGreaterThanNow: true
            }
        },
        messages: {
            sensor_name: {
                required: "Please select a sensor."  // Custom message for Sensor Name
            },
            start_datetime: {
                required: "Start datetime is required."
            },
            end_datetime: {
                required: "End datetime is required.",
                greaterThanStart: "End datetime must be greater than start datetime." // Custom message
            }
        },
        highlight: function (element) {
            $(element).addClass('is-invalid').removeClass('is-valid');
        },
        unhighlight: function (element) {
            $(element).removeClass('is-invalid').addClass('is-valid');
        },
        submitHandler: function (form, event) {
            event.preventDefault(); // Prevent default form submission

            // Collect form data
            var sensorName = $('#sensorName').val();
            var startDatetime = $('#startDatetime').val();
            var endDatetime = $('#endDatetime').val();
            var csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
            // Show loading spinner or disable the button
            $('#responseMessage').html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading...');
            $('#getDataButton').prop('disabled', true);

            // AJAX request to fetch sensor data
            $.ajax({
                url: '{% url "ajax_sensor_data" %}',  // URL of the Django view
                type: 'POST',
                data: {
                    sensor_name: sensorName,
                    start_datetime: startDatetime,
                    end_datetime: endDatetime,
                    csrfmiddlewaretoken: csrfToken // CSRF token for security
                },
                success: function (response) {
                    // Enable the button
                    $('#getDataButton').prop('disabled', false);

                    if (response.success) {
                        // Show chart container and render chart
                        $('#chartContainer').show();
                        $('#showPopupButton').show();

                        var ctx = document.getElementById('chart').getContext('2d');
                        if (Chart.getChart(ctx)) {
                            Chart.getChart(ctx).destroy(); // Destroy existing chart if present
                        }

                        const labels = response.data.chartData.map(item => item.time);
                        const values = response.data.chartData.map(item => parseFloat(item.value));

                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: "Training Data",
                                    data: values,
                                    borderColor: 'rgba(75, 192, 192, 1)',
                                    fill: false
                                }]
                            },
                            options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    scales: {
                                        x: {
                                            title: {
                                                display: true,
                                                // NAME YOUR X-AXIS TITLE HERE
                                                text: 'Timestamp'
                                            }
                                        },
                                        y: {
                                            title: {
                                                display: true,
                                                // NAME YOUR Y-AXIS TITLE HERE
                                                text: 'Sensor Values'
                                            }
                                        }
                                    }
                                }
                            });

                    } else {
                        // Handle case when no data is found
                        $('#responseMessage').html('<span class="text-warning">No data found for the selected range.</span>');
                        $('#chartContainer').hide(); // Hide chart if no data
                    }
                },
                error: function (xhr, status, error) {
                    // Enable the button
                    $('#getDataButton').prop('disabled', false);
                    $('#responseMessage').html('<span class="text-danger">An error occurred while fetching data. Please try again.</span>');
                    console.error('Error:', error);
                    $('#chartContainer').hide(); // Hide chart on error
                }
            });
        }
    });

    // Fetch earliest start date when the sensor name is selected
    $('#sensorName').on('change', function () {
        $.ajax({
            url: '{% url "get_startdate" %}',  // URL of the Django view
            type: "GET",
            dataType: "json",  // Expected response format
            data: { sensor_name: $(this).val() }, // Pass the selected sensor name
            success: function (response) {
                if (response.success) {
                    // Update UI with the fetched earliest start date
                    $("#startDatetime").attr("min", response.earliest_date);
                    $("#endDatetime").attr("min", response.earliest_date);
                    $("#responseMessage").text(`Earliestdfddff start date: ${response.earliest_date}`);
                } else {
                    // Display an error message if the response indicates failure
                    $("#responseMessage").text(response.message);
                }
            },
            error: function (xhr, status, error) {
                // Handle errors
                console.error("Error occurred:", error);
                $("#responseMessage").text("An error occurred while fetching the data.");
            }
        });
    });

    // Show the modal when the "Show Pop-Up" button is clicked
    $('#showPopupButton').on('click', function () {
        $('#myModal').modal('show');
    });

    // Handle form submission inside the modal (Submit Training Parameters)
    $('#submitNumbers').on('click', function () {
        var sensor_name = $('#sensorName').val();
        var start_datetime = $('#startDatetime').val();
        var end_datetime = $('#endDatetime').val();
        var No_of_Epochs = parseFloat($('#No_of_Epochs').val());
        var No_of_steps = parseFloat($('#No_of_steps').val());
        var anomaly_percentage = parseFloat($('#anomaly_percentage').val());

        // Validate if all fields are filled and contain valid numbers
        if (isNaN(No_of_Epochs) || isNaN(No_of_steps) || isNaN(anomaly_percentage)) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Input',
                text: 'Please enter valid numbers for all fields (No of Epochs, No of steps, Anomaly percentage).'
            });
            return;
        }
        if (No_of_Epochs < 150 || No_of_Epochs > 450 ) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Input',
                text: 'Please enter No of epochs within Range'
            });
            return;
        }
        if (No_of_steps < 10 || No_of_steps > 30 ) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Input',
                text: 'Please enter No of steps within Range'
            });
            return;
        }
        if (anomaly_percentage < 1 || anomaly_percentage > 10) {
            Swal.fire({
                icon: 'error',
                title: 'Invalid Input',
                text: 'Please enter Anomaly percentage within Range'
            });
            return;
        }

        // Show the loading spinner and disable the submit button
        $('#loadingSpinner').show();
        $('#submitNumbers').prop('disabled', true);
        $('#modal').prop('disabled', true);

        // AJAX request to send training parameters
        $.ajax({
            url: '{% url "train_model" %}',  // URL of the Django view
            type: 'POST',
            data: {
                start_datetime: start_datetime,
                end_datetime: end_datetime,
                sensor_name: sensor_name,
                No_of_Epochs: No_of_Epochs,
                No_of_steps: No_of_steps,
                anomaly_percentage: anomaly_percentage,
                csrfmiddlewaretoken: $('input[name="csrfmiddlewaretoken"]').val() // CSRF token for security
            },
            success: function (response) {
                $('#loadingSpinner').hide();
                $('#submitNumbers').prop('disabled', false);
                $('#myModal').modal('hide');

                if (response.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: response.message,
                        showCancelButton: true,
                        confirmButtonText: 'Go to Dashboard',
                        cancelButtonText: 'Stay Here',
                        preConfirm: () => {
                            window.location.href = '/predictive/predictive_screen/';  // Redirect to dashboard
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: response.message
                    });
                }
            },
            error: function (xhr, status, error) {
                $('#loadingSpinner').hide();
                $('#submitNumbers').prop('disabled', false);
                $('#modal').prop('disabled', false);
                Swal.fire({
                    icon: 'error',
                    title: 'An error occurred',
                    text: 'An error occurred while processing the request. Please try again.'
                });
                console.error('Error:', error);
            }
        });
    });
});
</script>

{% endblock %}
