{% extends "base.html" %}
{% block title %}Predictive Maintenance {% endblock %}

{% block content %}

<div class="container-fluid" >
    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title" style="font-size:30px">Update Eamil</h5>
            <form id="orgForm" method="POST">
                {% csrf_token %}
                    <div class="row align-items-end mt-2">

                 <div class="col-md-3 form-group">
                  <label for="name">Name</label>
                  <input name="name" id="name" type="text"
                           pattern="[A-Za-z0-9]+"
                           value = "{{settings_org.name}}"
                           oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '')"
                           title="Only letters and numbers allowed"
                           class="form-control" required>
                 </div>

                <div class="col-md-3 form-group">
                  <label for="email">Email</label>
                  <input name="email" id="email" value="{{settings_org.email}}" type="email" class="form-control"
                         oninput="this.value = this.value.replace(/^\s+/, '')" required>
                 </div>
                 <div class="col-md-3 form-group">
                            <label for="org_id">Organization ID</label>
                            <input id="org_id" value="{{settings_org.org_id}}" name="org_id" type="number" class="form-control" required>
                        </div>

                 <div class="col-md-3 form-group">
                    <label for="recipient_type">recipient_type</label>
                    <select name="recipient_type" id="recipient_type" value="{{settings_org.recipient_type}}" type="text" class="form-control"  required>

                             <option value="To">To</option>
                             <option value="cc">cc</option>
                            <option value="Bcc">Bcc</option>
                         </select>
                   </div>


                        <div class="col-md-3 form-group">
                    <label for="status">Status</label>
                    <select name="status" id="status" value="{{settings_org.status}}" type="text" class="form-control"  required>
                        <option value="">-- Select status --</option>
                             <option value="True" {% if settings_org.status == True %}selected{% endif %}>True</option>
                             <option value="False" {% if settings_org.status == False %}selected{% endif %}>False</option>
                    </select>
                   </div>

                <div class="col-md-3 text-end" style="padding-bottom:31px" >
                                <button type="submit" class="btn btn-success mt-4" >Submit</button>
                                <a href="{% url 'email_list' %}" class="btn btn-secondary mt-4">Cancel</a>
                            </div>
                    </div>
              </form>
        </div>
    </div>
</div>
{% endblock %}
{% block javascript %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<style>
    .form-group .text-danger {
    min-height: 1.25rem;  /* Reserve space for error */
    display: block;
    font-size: 0.875rem;
}
    .form-group {
    position: relative;
    min-height: 85px; /* Adjust as needed */
}


</style>
<script>
    $(document).ready(function() {

    // Add custom validator to check for non-whitespace input
    $.validator.addMethod("noWhitespace", function(value, element) {
        return $.trim(value).length > 0;
    }, "This field cannot be empty or whitespace only.");

    // Apply validation to the form
    $("#orgForm").validate({
        errorClass: "text-danger",  // Error message color
        errorElement: "span",       // Error message element
        rules: {
            name: {
                required: true,
                noWhitespace: true
            },
            email: {
                required: true,
                noWhitespace: true
            },
            recipient_type: {
                required: true,

            },
            status: {
                required: true,

            }
        },
        messages: {
            name: {
                required: "Please enter a name.",
                noWhitespace: "Please enter a name."
            },
            email: {
                required: "Please enter a email.",
                noWhitespace: "Please enter a email."
            },
            recipient_type: {
                required: "Please select a type.",

            },
            status: {
                required: "Please select status.",

            }
        },
        highlight: function(element) {
            $(element).addClass('is-invalid').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid').addClass('is-valid');
        },
    });
});

</script>
{% endblock %}
